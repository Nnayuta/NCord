name: Build & Auto Release LoveChat

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Incrementar versão automaticamente?'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
          - 'major'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Executable & Auto Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Determinar Versão e Tag
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $currentVer = $pkg.version
          $bump = "${{ github.event.inputs.bump_type }}"

          # Se o usuário acionou manualmente escolhendo bump (patch/minor/major)
          if ($bump -and $bump -ne "none" -and $bump -ne "") {
            $parts = $currentVer.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            if ($bump -eq "patch") { $patch++ }
            elseif ($bump -eq "minor") { $minor++; $patch = 0 }
            elseif ($bump -eq "major") { $major++; $minor = 0; $patch = 0 }

            $newVer = "$major.$minor.$patch"
            $pkg.version = $newVer
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding utf8

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): auto-bump version to v$newVer [skip ci]"
            git push

            $currentVer = $newVer
          }

          # Se o gatilho for uma tag git (ex: v1.0.2)
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $currentVer = $tag.TrimStart('v')
          } else {
            $tag = "v$currentVer"
          }

          Write-Host "Versao da release: $currentVer (Tag: $tag)"
          echo "VERSION=$currentVer" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Frontend Vite
        run: npm run build

      - name: Gerar Executável Portátil (LoveChat.exe)
        run: npx electron-builder --win portable

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: LoveChat ${{ steps.get_version.outputs.TAG_NAME }}
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          files: |
            dist/LoveChat.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
